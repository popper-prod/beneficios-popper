<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a1628" />
    <meta name="description" content="Sistema Premium de Verificacion de Beneficios - GRUPO POPPER" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Popper Benefits" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>GRUPO POPPER - Sistema de Beneficios</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #0a1628; }
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0a1628 0%, #132d50 50%, #0d2137 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.6s ease, transform 0.6s ease;
      }
      #loading-screen.hidden {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }
      .loading-logo {
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, #fff, #f0f0f0);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 40px rgba(255,215,0,0.1);
        margin-bottom: 24px;
        animation: logoPulse 2s ease-in-out infinite;
      }
      .loading-logo span {
        font-size: 22px;
        font-weight: 900;
        background: linear-gradient(135deg, #1e3a5f, #2d5a87);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -0.5px;
      }
      .loading-bar-container {
        width: 200px;
        height: 2px;
        background: rgba(255,255,255,0.06);
        border-radius: 4px;
        overflow: hidden;
        margin-top: 20px;
      }
      .loading-bar {
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #ffd700, transparent);
        border-radius: 4px;
        animation: loadingSlide 1.5s ease-in-out infinite;
      }
      .loading-text {
        color: rgba(255,255,255,0.3);
        margin-top: 16px;
        font-size: 11px;
        letter-spacing: 3px;
        text-transform: uppercase;
        font-weight: 500;
      }
      @keyframes logoPulse {
        0%, 100% { transform: scale(1); box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 40px rgba(255,215,0,0.1); }
        50% { transform: scale(1.05); box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 60px rgba(255,215,0,0.15); }
      }
      @keyframes loadingSlide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loading-logo">
        <span>GP</span>
      </div>
      <div class="loading-bar-container">
        <div class="loading-bar"></div>
      </div>
      <p class="loading-text">Grupo Popper</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
