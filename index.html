<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#08090A" />
    <meta name="description" content="Sistema de beneficios — Grupo Popper" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Grupo Popper" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2308090a'/><text x='50' y='62' font-family='-apple-system,BlinkMacSystemFont,sans-serif' font-size='38' font-weight='700' fill='%23d4a017' text-anchor='middle' letter-spacing='-2'>GP</text></svg>">
    <title>Grupo Popper</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #08090A;
        -webkit-font-smoothing: antialiased;
      }
      #loading {
        position: fixed;
        inset: 0;
        background: #08090A;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 280ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loading-dot {
        width: 8px;
        height: 8px;
        background: #d4a017;
        border-radius: 50%;
        animation: dot 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes dot {
        0%, 100% { opacity: 0.3; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.1); }
      }
    </style>
  </head>
  <body>
    <div id="loading"><div class="loading-dot"></div></div>
    <div id="root"></div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
