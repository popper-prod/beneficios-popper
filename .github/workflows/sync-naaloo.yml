name: Sync Naaloo — Sincronización diaria

on:
  schedule:
    # 7am hora Argentina (UTC-3) = 10:00 UTC
    - cron: '0 10 * * *'
  workflow_dispatch:
    # También se puede disparar manualmente desde GitHub

jobs:
  sync:
    name: Disparar sync Naaloo
    runs-on: ubuntu-latest

    steps:
      - name: Esperar que el backend esté listo
        run: |
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://beneficios-backend-jfpx.onrender.com/api/health)
            if [ "$STATUS" = "200" ]; then
              echo "Backend listo (intento $i)"
              break
            fi
            echo "Intento $i: HTTP $STATUS — esperando 10s..."
            sleep 10
          done

      - name: Disparar sync (fire-and-forget)
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/sync_response.json -w "%{http_code}" \
            --max-time 30 \
            "https://beneficios-backend-jfpx.onrender.com/api/internal/sync?secret=${{ secrets.CRON_SECRET }}")

          if [ "$HTTP_STATUS" != "202" ] && [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::No se pudo disparar sync — HTTP $HTTP_STATUS"
            cat /tmp/sync_response.json
            exit 1
          fi

          echo "✅ Sync disparado correctamente — HTTP $HTTP_STATUS"
          cat /tmp/sync_response.json
          echo ""
          echo "El sync corre en background. Resultado en Render logs."
