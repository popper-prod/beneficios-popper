name: Sync Naaloo — Sincronización diaria

on:
  schedule:
    # 7am hora Argentina (UTC-3) = 10:00 UTC
    - cron: '0 10 * * *'
  workflow_dispatch:
    # También se puede disparar manualmente desde GitHub

jobs:
  sync:
    name: Sincronizar con Naaloo
    runs-on: ubuntu-latest

    steps:
      - name: Ejecutar sync
        id: sync
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/sync_response.json -w "%{http_code}" \
            --max-time 60 \
            "https://beneficios-backend-jfpx.onrender.com/api/internal/sync?secret=${{ secrets.CRON_SECRET }}")

          echo "status=$HTTP_STATUS" >> $GITHUB_OUTPUT

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Sync falló — HTTP $HTTP_STATUS"
            cat /tmp/sync_response.json
            exit 1
          fi

          ALTAS=$(cat /tmp/sync_response.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('resumen',{}).get('altas',0))")
          BAJAS=$(cat /tmp/sync_response.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('resumen',{}).get('bajas',0))")
          ACTUALIZADOS=$(cat /tmp/sync_response.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('resumen',{}).get('actualizados',0))")
          TOTAL=$(cat /tmp/sync_response.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('resumen',{}).get('totalNaaloo',0))")

          echo "altas=$ALTAS" >> $GITHUB_OUTPUT
          echo "bajas=$BAJAS" >> $GITHUB_OUTPUT
          echo "actualizados=$ACTUALIZADOS" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          echo "✅ Sync OK — Total: $TOTAL | Altas: $ALTAS | Bajas: $BAJAS | Actualizados: $ACTUALIZADOS"
